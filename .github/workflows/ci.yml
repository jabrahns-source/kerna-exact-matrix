name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Zero floating-point gate
        run: |
          set -euo pipefail
          HITS=$(grep -rE --include='*.zig' -n '\b(f32|f64|f128)\b' src/ examples/ build.zig | grep -v '//' || true)
          if [ -n "$HITS" ]; then
            echo "ERROR: floating-point token detected"
            echo "$HITS"
            exit 1
          fi
          echo "PASS: zero floating-point tokens"

      - name: Test
        run: zig build test --summary all

      - name: Build
        run: zig build --summary all

      - name: Run examples
        run: |
          ./zig-out/bin/basic
          ./zig-out/bin/grid_lmp_scale
