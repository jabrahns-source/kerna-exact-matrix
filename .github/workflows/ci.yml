name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig 0.13.0
        run: |
          set -euo pipefail
          curl -fsSL -o zig.tar.xz https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz
          tar -xf zig.tar.xz
          echo "$PWD/zig-linux-x86_64-0.13.0" >> "$GITHUB_PATH"
          zig version

      - name: Zero floating-point gate
        run: |
          set -euo pipefail
          HITS=$(grep -rE --include='*.zig' -n '\b(f32|f64|f128)\b' src/ examples/ build.zig | grep -v '//' || true)
          if [ -n "$HITS" ]; then
            echo "ERROR: floating-point token detected"
            echo "$HITS"
            exit 1
          fi
          echo "PASS: zero floating-point tokens"

      - name: Test
        run: zig build test --summary all

      - name: Build
        run: zig build --summary all

      - name: Run examples
        run: |
          set -euo pipefail
          ./zig-out/bin/basic
          ./zig-out/bin/grid_lmp_scale
          echo "Examples OK"
